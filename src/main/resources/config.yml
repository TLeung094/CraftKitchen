settings:
  item-mode: auto
  language: zh_TW
  shared-radius: 5
  shared-multiplier: 1.5
  perfect-multiplier: 1.5
  level-enabled: true
  holiday-enabled: true
  cooking-timeout-seconds: 300
  perfect-window-seconds: 30

foods:
  braised_beef:
    name: 红烧牛肉
    material: COOKED_BEEF
    custom-model-data: 10201
    effects:
      - type: STRENGTH
        duration: 60
        amplifier: 0
  knight_steak:
    name: 香煎骑士牛排
    material: COOKED_BEEF
    custom-model-data: 10202
    effects:
      - type: STRENGTH
        duration: 60
        amplifier: 1
      - type: RESISTANCE
        duration: 30
        amplifier: 0
  egg_fried_rice:
    name: 蛋炒饭
    material: COOKED_BEEF
    custom-model-data: 10203
    effects:
      - type: SPEED
        duration: 30
        amplifier: 0
      - type: SATURATION
        duration: 5
        amplifier: 0

recipes:
  braised_beef:
    name: 红烧牛肉
    steps: [cut, marinate, cook]
    ingredients: [BEEF]
  knight_steak:
    name: 香煎骑士牛排
    steps: [cut, cook, season]
    ingredients: [BEEF]

seasonings:
  chili:
    name: 辣椒
    material: RED_DYE
    effects:
      - type: SPEED
        duration: 30
        amplifier: 0
  honey:
    name: 蜂蜜
    material: HONEY_BOTTLE
    effects:
      - type: REGENERATION
        duration: 5
        amplifier: 0

hidden-recipes:
  egg_fried_rice:
    name: 蛋炒饭
    base: braised_beef
    seasonings: [chili, honey]

quality:
  enabled: true
  speed-weight: 0.5        # 完成速度對高級機率的加權（0=純機率，1=純速度）
  level-weight: 0.15      # 廚師等級加權
  tiers:
    failed:    { probability: 0.05, multiplier: 0.5 }   # 失敗：凋零，灰色，效果 0.5x
    normal:    { probability: 0.40, multiplier: 1.0 }  # 普通：常木，白色
    fine:      { probability: 0.35, multiplier: 1.25 } # 精良：新芽，綠色
    rare:      { probability: 0.15, multiplier: 1.5 }  # 稀有：古木，青色
    legendary: { probability: 0.05, multiplier: 2.0 }  # 傳說：森羅，金色，效果 2.0x

database:
  type: sqlite
  file: data.db