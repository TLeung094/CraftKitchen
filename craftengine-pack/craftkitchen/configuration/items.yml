items:
  # ---------- 料理食物（純食物物品）----------
  craftkitchen:smoked_steak:
    material: cooked_beef
    model: craftkitchen:item/smoked_steak
    data:
      item_name: "<!i><color:#8B3A1F><b>煙燻牛排</b>"
      lore:
        - "<!i><color:#5C3A1E>森林深處的炭火煙燻"
        - "<!i><color:#7C4F26>香氣繚繞不散"

  craftkitchen:herb_steak:
    material: cooked_beef
    model: craftkitchen:item/herb_steak
    data:
      item_name: "<!i><color:#4A7C3A><b>香草牛排</b>"
      lore:
        - "<!i><color:#5C7C3E>晨露沾葉的清新香草"
        - "<!i><color:#7C8C5E>林間清新物語"

  craftkitchen:honey_spicy_steak:
    material: cooked_beef
    model: craftkitchen:item/honey_spicy_steak
    data:
      item_name: "<!i><color:#C8682C><b>蜜汁辣牛排</b>"
      lore:
        - "<!i><color:#A8582A>蜂蜜與野辣椒的邂逅"
        - "<!i><color:#7C3818>森之甜辣物語"
        - "<!i><color:#9C9C9C>★ 隱藏食譜"

  # ---------- 廚房方塊（block_item，放置後變方塊）----------
  craftkitchen:cutting_board:
    material: paper
    model: craftkitchen:item/cutting_board
    data:
      item_name: "<!i><color:#5C3A1E><b>森林砧板</b>"
      lore:
        - "<!i><color:#7C4F26>森林木匠手作"
        - "<!i><color:#7C4F26>承載食材的回憶"
        - "<!i><color:#9C9C9C>放置後觸發切割步驟"
    behavior:
      type: block_item
      block:
        state:
          auto_state: note_block
          model:
            path: craftkitchen:block/cutting_board
            textures:
              - craftkitchen:block/cutting_board_top
              - craftkitchen:block/cutting_board_side
        settings:
          hardness: 2.0
          sounds:
            break: minecraft:block.wood.break
            step: minecraft:block.wood.step
            place: minecraft:block.wood.place
            hit: minecraft:block.wood.hit
            fall: minecraft:block.wood.fall
          tags:
            - minecraft:mineable/axe
        loot:
          template: default:loot_table/self

  craftkitchen:stove:
    material: paper
    model: craftkitchen:item/stove
    data:
      item_name: "<!i><color:#3A2410><b>森羅爐灶</b>"
      lore:
        - "<!i><color:#5C3A1E>石砌老爐，木柴燒出森羅真味"
        - "<!i><color:#9C9C9C>放置後用打火石點燃"
        - "<!i><color:#9C9C9C>潛行右鍵觸發烹煮步驟"
    behavior:
      type: block_item
      block:
        state:
          auto_state: note_block
          model:
            path: craftkitchen:block/stove
            textures:
              - craftkitchen:block/stove_top
              - craftkitchen:block/stove_side
        settings:
          hardness: 5.0
          sounds:
            break: minecraft:block.stone.break
            step: minecraft:block.stone.step
            place: minecraft:block.stone.place
            hit: minecraft:block.stone.hit
            fall: minecraft:block.stone.fall
          tags:
            - minecraft:mineable/pickaxe
        loot:
          template: default:loot_table/self

  craftkitchen:marinating_stand:
    material: paper
    model: craftkitchen:item/marinating_stand
    data:
      item_name: "<!i><color:#4A7C3A><b>森林醃製台</b>"
      lore:
        - "<!i><color:#5C7C3E>藤蔓纏繞的森林魔藥架"
        - "<!i><color:#5C7C3E>浸泡時間的祕方"
        - "<!i><color:#9C9C9C>放置後觸發醃製步驟"
    behavior:
      type: block_item
      block:
        state:
          auto_state: note_block
          texture: craftkitchen:block/marinating_stand
        settings:
          hardness: 2.0
          sounds:
            break: minecraft:block.wood.break
            step: minecraft:block.wood.step
            place: minecraft:block.wood.place
            hit: minecraft:block.wood.hit
            fall: minecraft:block.wood.fall
          tags:
            - minecraft:mineable/axe
        loot:
          template: default:loot_table/self

  craftkitchen:seasoning_table:
    material: paper
    model: craftkitchen:item/seasoning_table
    data:
      item_name: "<!i><color:#B07A3F><b>森羅調味桌</b>"
      lore:
        - "<!i><color:#7C4F26>四碗香料"
        - "<!i><color:#7C4F26>訴說四季的森羅物語"
        - "<!i><color:#9C9C9C>放置後觸發調味步驟"
    behavior:
      type: block_item
      block:
        state:
          auto_state: note_block
          model:
            path: craftkitchen:block/seasoning_table
            textures:
              - craftkitchen:block/seasoning_table_top
              - craftkitchen:block/seasoning_table_side
        settings:
          hardness: 2.5
          sounds:
            break: minecraft:block.wood.break
            step: minecraft:block.wood.step
            place: minecraft:block.wood.place
            hit: minecraft:block.wood.hit
            fall: minecraft:block.wood.fall
          tags:
            - minecraft:mineable/axe
        loot:
          template: default:loot_table/self

# 確保 `model:` 引用 reference 指向 resources/assets/craftkitchen/models/
# 對應模型 JSON 請見 resourcepack/assets/craftkitchen/models/