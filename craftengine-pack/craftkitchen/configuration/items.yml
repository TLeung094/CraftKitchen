# ========================================
# CraftKitchen items.yml + blocks.yml — 森罗物语：厨房
# Pattern: blocks defined under blocks:, items reference via behavior.block
# Fix: separate blocks section (note_block textures fixed, texture paths correct)
# ========================================

# ----------------------------------------------------------------------------
# 方塊定義（獨立 blocks section）
# 每個方塊有完整 state/settings/loot，物品透過 behavior.block 引用
# ----------------------------------------------------------------------------

blocks:

  # 菜板（木製，切食材用）
  craftkitchen:cutting_board:
    state:
      auto_state: note_block
      model:
        texture: craftkitchen:block/cutting_board
    settings:
      hardness: 2.0
      resistance: 6.0
      sounds:
        break: minecraft:block.wood.break
        step: minecraft:block.wood.step
        place: minecraft:block.wood.place
        hit: minecraft:block.wood.hit
        fall: minecraft:block.wood.fall
    loot: craftkitchen:cutting_board

  # 爐灶（煮食用，火屬性）
  craftkitchen:stove:
    state:
      auto_state: note_block
      model:
        texture: craftkitchen:block/stove
    settings:
      hardness: 5.0
      resistance: 10.0
      luminance: 7
      sounds:
        break: minecraft:block.stone.break
        step: minecraft:block.stone.step
        place: minecraft:block.stone.place
        hit: minecraft:block.stone.hit
        fall: minecraft:block.stone.fall
    loot: craftkitchen:stove

  # 搪瓷盆子（洗菜/醃製用，金屬+玻璃）
  craftkitchen:enamel_basin:
    state:
      auto_state: note_block
      model:
        texture: craftkitchen:block/enamel_basin
    settings:
      hardness: 1.5
      resistance: 3.0
      sounds:
        break: minecraft:block.glass.break
        step: minecraft:block.metal.step
        place: minecraft:block.metal.place
        hit: minecraft:block.metal.hit
        fall: minecraft:block.metal.fall
    loot: craftkitchen:enamel_basin

  # 廚具架（裝飾性，竹製）
  craftkitchen:utensil_rack:
    state:
      auto_state: note_block
      model:
        texture: craftkitchen:block/utensil_rack
    settings:
      hardness: 1.0
      resistance: 2.0
      sounds:
        break: minecraft:block.bamboo_wood.break
        step: minecraft:block.bamboo_wood.step
        place: minecraft:block.bamboo_wood.place
        hit: minecraft:block.bamboo_wood.hit
        fall: minecraft:block.bamboo_wood.fall
    loot: craftkitchen:utensil_rack

  # 炒鍋（中式廚房必備，鐵製）
  craftkitchen:wok:
    state:
      auto_state: note_block
      model:
        texture: craftkitchen:block/wok
    settings:
      hardness: 3.0
      resistance: 6.0
      sounds:
        break: minecraft:block.metal.break
        step: minecraft:block.metal.step
        place: minecraft:block.metal.place
        hit: minecraft:block.metal.hit
        fall: minecraft:block.metal.fall
    loot: craftkitchen:wok

  # 湯鍋（燉湯用）
  craftkitchen:soup_pot:
    state:
      auto_state: note_block
      model:
        texture: craftkitchen:block/soup_pot
    settings:
      hardness: 3.0
      resistance: 6.0
      sounds:
        break: minecraft:block.metal.break
        step: minecraft:block.metal.step
        place: minecraft:block.metal.place
        hit: minecraft:block.metal.hit
        fall: minecraft:block.metal.fall
    loot: craftkitchen:soup_pot

  # 蒸籠（蒸食物，竹製）
  craftkitchen:steamer:
    state:
      auto_state: note_block
      model:
        texture: craftkitchen:block/steamer
    settings:
      hardness: 1.5
      resistance: 3.0
      sounds:
        break: minecraft:block.bamboo_wood.break
        step: minecraft:block.bamboo_wood.step
        place: minecraft:block.bamboo_wood.place
        hit: minecraft:block.bamboo_wood.hit
        fall: minecraft:block.bamboo_wood.fall
    loot: craftkitchen:steamer

  # 石磨（磨豆漿/研磨）
  craftkitchen:stone_mill:
    state:
      auto_state: note_block
      model:
        texture: craftkitchen:block/stone_mill
    settings:
      hardness: 4.0
      resistance: 8.0
      sounds:
        break: minecraft:block.stone.break
        step: minecraft:block.stone.step
        place: minecraft:block.stone.place
        hit: minecraft:block.stone.hit
        fall: minecraft:block.stone.fall
    loot: craftkitchen:stone_mill

  # 油壺（裝飾）
  craftkitchen:oil_pot:
    state:
      auto_state: note_block
      model:
        texture: craftkitchen:block/oil_pot
    settings:
      hardness: 1.0
      resistance: 2.0
      sounds:
        break: minecraft:block.glass.break
        step: minecraft:block.metal.step
        place: minecraft:block.metal.place
        hit: minecraft:block.metal.hit
        fall: minecraft:block.metal.fall
    loot: craftkitchen:oil_pot

  # 茶壺（裝飾）
  craftkitchen:teapot:
    state:
      auto_state: note_block
      model:
        texture: craftkitchen:block/teapot
    settings:
      hardness: 1.5
      resistance: 3.0
      sounds:
        break: minecraft:block.glass.break
        step: minecraft:block.metal.step
        place: minecraft:block.metal.place
        hit: minecraft:block.metal.hit
        fall: minecraft:block.metal.fall
    loot: craftkitchen:teapot

  # 水果籃（裝飾）
  craftkitchen:fruit_basket:
    state:
      auto_state: note_block
      model:
        texture: craftkitchen:block/fruit_basket
    settings:
      hardness: 1.0
      resistance: 2.0
      sounds:
        break: minecraft:block.bamboo_wood.break
        step: minecraft:block.bamboo_wood.step
        place: minecraft:block.bamboo_wood.place
        hit: minecraft:block.bamboo_wood.hit
        fall: minecraft:block.bamboo_wood.fall
    loot: craftkitchen:fruit_basket

  # 食譜書（裝飾+指引）
  craftkitchen:recipe_book:
    state:
      auto_state: note_block
      model:
        texture: craftkitchen:block/recipe_book
    settings:
      hardness: 0.5
      resistance: 1.0
      sounds:
        break: minecraft:block.wood.break
        step: minecraft:block.wood.step
        place: minecraft:block.wood.place
        hit: minecraft:block.wood.hit
        fall: minecraft:block.wood.fall
    loot: craftkitchen:recipe_book

  # 旋風烤爐
  craftkitchen:cyclone_grill:
    state:
      auto_state: note_block
      model:
        texture: craftkitchen:block/cyclone_grill
    settings:
      hardness: 5.0
      resistance: 10.0
      luminance: 7
      sounds:
        break: minecraft:block.stone.break
        step: minecraft:block.stone.step
        place: minecraft:block.stone.place
        hit: minecraft:block.stone.hit
        fall: minecraft:block.stone.fall
    loot: craftkitchen:cyclone_grill

  # 稻草人（裝飾）
  craftkitchen:scarecrow:
    state:
      auto_state: note_block
      model:
        texture: craftkitchen:block/scarecrow
    settings:
      hardness: 0.5
      resistance: 1.0
      sounds:
        break: minecraft:block.wood.break
        step: minecraft:block.wood.step
        place: minecraft:block.wood.place
        hit: minecraft:block.wood.hit
        fall: minecraft:block.wood.fall
    loot: craftkitchen:scarecrow

  # 垃圾桶
  craftkitchen:trash_can:
    state:
      auto_state: note_block
      model:
        texture: craftkitchen:block/trash_can
    settings:
      hardness: 2.0
      resistance: 5.0
      sounds:
        break: minecraft:block.metal.break
        step: minecraft:block.metal.step
        place: minecraft:block.metal.place
        hit: minecraft:block.metal.hit
        fall: minecraft:block.metal.fall
    loot: craftkitchen:trash_can


